name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            artifact: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      # the backend keeps its dev dependencies until build:backend has compiled it, then prunes them
      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Type check and test
        run: npm run typecheck && npm test

      - name: Build and package
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.artifact }}
            dist/latest*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the website shows the version from the root package.json, so it is rebuilt once every installer is up
  website:
    name: Redeploy the website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the website workflow on main
        run: gh workflow run deploy-site.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
