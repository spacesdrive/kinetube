<head>
  <meta charset="UTF-8" />
  <title>kinetube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #161416;
      color: #f2eeea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100vh;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    .lockup { display: flex; align-items: center; gap: 14px; }
    .mark { width: 48px; height: 48px; animation: turn 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .word { font-family: "Unbounded", "DM Sans", system-ui, sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.02em; }
    .msg { font-size: 14px; color: #a8a1a6; }
    /* a short clockwise turn that eases to a stop, then rests, as the brand kit describes for loaders */
    @keyframes turn {
      0% { transform: rotate(0deg); }
      45%, 100% { transform: rotate(120deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: fade 1.6s ease-in-out infinite alternate; }
      @keyframes fade { from { opacity: 1; } to { opacity: 0.5; } }
    }
  </style>
</head>
