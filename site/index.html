<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kinetube: save YouTube and Instagram media, then turn it into text</title>
    <meta name="description" content="kinetube is a free, open-source desktop app that downloads YouTube and Instagram media and transcribes it with Whisper, all on your own computer." />
    <link rel="canonical" href="https://kinetube.ujjwal.fyi/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kinetube" />
    <meta property="og:title" content="kinetube" />
    <meta property="og:description" content="A free, open-source desktop app that downloads YouTube and Instagram media and transcribes it with Whisper, all on your own computer." />
    <meta property="og:url" content="https://kinetube.ujjwal.fyi/" />
    <meta property="og:image" content="https://kinetube.ujjwal.fyi/brand/kinetube-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/brand/kinetube-app-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/kinetube-app-icon-180.png" />
    <meta name="theme-color" content="#161416" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the hero mark is the largest thing on a phone's first screen, so it is fetched before the script asks for it -->
    <link rel="preload" href="/brand/kinetube-mark-ink-192.png" as="image" fetchpriority="high" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/brand/kinetube-mark-white-192.png" as="image" fetchpriority="high" media="(prefers-color-scheme: dark)" />
    <script>
      // the saved choice, or the system setting, before the first paint so the page never flashes the other theme
      try {
        var saved = localStorage.getItem('kinetube-site-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
